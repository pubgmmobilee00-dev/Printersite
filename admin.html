<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f7;
        }

        h1 {
            text-align: center;
        }

        .upload-box {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        input {
            width: 100%;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
        }

        #status {
            text-align: center;
            margin-top: 15px;
        }

        #count {
            text-align: center;
            color: #555;
        }

        #photos {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(180px, 1fr)
            );
            gap: 15px;
            margin-top: 30px;
        }

        .photo {
            background: white;
            padding: 10px;
            border-radius: 15px;
        }

        .photo img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .download {
            display: block;
            margin-top: 10px;
            padding: 12px;
            text-align: center;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>📸 Admin Panel</h1>

    <div class="upload-box">

        <input
            type="file"
            id="photoInput"
            accept="image/*"
            multiple
        >

        <button id="uploadButton">
            📤 Şəkilləri yüklə
        </button>

        <p id="status">Şəkil seçin.</p>

    </div>

    <p id="count">Şəkillər yüklənir...</p>

    <div id="photos"></div>


    <script>

        const input =
            document.getElementById("photoInput");

        const uploadButton =
            document.getElementById("uploadButton");

        const status =
            document.getElementById("status");


        // Şəkil seçiləndə
        input.addEventListener("change", () => {

            const files =
                Array.from(input.files);

            if (files.length === 0) {
                status.textContent =
                    "Şəkil seçin.";
                return;
            }

            status.textContent =
                `✅ ${files.length} şəkil seçildi.`;

        });


        // Şəkilləri serverə göndər
        uploadButton.addEventListener("click", async () => {

            const files =
                Array.from(input.files);

            if (files.length === 0) {

                status.textContent =
                    "❌ Əvvəlcə şəkil seç.";

                return;
            }


            const formData =
                new FormData();


            files.forEach(file => {

                formData.append(
                    "photos",
                    file
                );

            });


            uploadButton.disabled = true;

            status.textContent =
                "⏳ Şəkillər yüklənir...";


            try {

                const response =
                    await fetch(
                        "/api/upload",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    status.textContent =
                        `✅ ${result.count} şəkil yükləndi!`;

                    input.value = "";

                    loadPhotos();

                } else {

                    status.textContent =
                        "❌ Şəkillər yüklənmədi.";

                }

            } catch (error) {

                console.error(error);

                status.textContent =
                    "❌ Serverə qoşulmaq olmadı.";

            }


            uploadButton.disabled = false;

        });


        // Serverdəki şəkilləri göstər
        async function loadPhotos() {

            try {

                const response =
                    await fetch("/api/photos");


                if (!response.ok) {
                    throw new Error(
                        "API xətası"
                    );
                }


                const photos =
                    await response.json();


                const container =
                    document.getElementById(
                        "photos"
                    );


                const count =
                    document.getElementById(
                        "count"
                    );


                count.textContent =
                    `Ümumi şəkil sayı: ${photos.length}`;


                container.innerHTML = "";


                photos.reverse().forEach(photo => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "photo";


                    div.innerHTML = `
                        <img
                            src="${photo.url}"
                            alt="Şəkil"
                        >

                        <a
                            class="download"
                            href="${photo.url}"
                            download
                        >
                            ⬇️ Şəkli endir
                        </a>
                    `;


                    container.appendChild(div);

                });


            } catch (error) {

                console.error(error);

                document.getElementById(
                    "count"
                ).textContent =
                    "❌ Şəkilləri yükləmək mümkün olmadı.";

            }

        }


        // İlk açılışda şəkilləri göstər
        loadPhotos();


        // 5 saniyədən bir yenilə
        setInterval(
            loadPhotos,
            5000
        );

    </script>

</body>
</html>
