<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f7;
        }

        h1 {
            text-align: center;
        }

        #photos {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(180px, 1fr)
            );
            gap: 15px;
            margin-top: 30px;
        }

        .photo {
            background: white;
            padding: 10px;
            border-radius: 15px;
        }

        .photo img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .download {
            display: block;
            margin-top: 10px;
            padding: 12px;
            text-align: center;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        #count {
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

    <h1>📸 Admin Panel</h1>

    <p id="count">Şəkillər yüklənir...</p>

    <div id="photos"></div>

    <script>
        async function loadPhotos() {

            try {

                const response = await fetch("/api/photos");
                const photos = await response.json();

                const container =
                    document.getElementById("photos");

                const count =
                    document.getElementById("count");

                count.textContent =
                    `Ümumi şəkil sayı: ${photos.length}`;

                container.innerHTML = "";

                photos.reverse().forEach(photo => {

                    const div =
                        document.createElement("div");

                    div.className = "photo";

                    div.innerHTML = `
                        <img src="${photo.url}">
                        <a
                            class="download"
                            href="${photo.url}"
                            download
                        >
                            ⬇️ Şəkli endir
                        </a>
                    `;

                    container.appendChild(div);
                });

            } catch (error) {

                document.getElementById("count").textContent =
                    "Şəkilləri yükləmək mümkün olmadı.";

            }
        }

        loadPhotos();

        setInterval(loadPhotos, 5000);
    </script>

</body>
</html>
