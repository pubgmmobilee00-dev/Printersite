<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Şəkil Köçürmə</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="logo">
                🖨️
            </div>

            <h1>Şəkil Köçürmə</h1>

            <p class="subtitle">
                Çap üçün şəkillərinizi seçin və
                asanlıqla bizə göndərin.
            </p>

            <label
                for="photoInput"
                class="main-button"
            >
                <span>📷</span>
                Şəkil seç və göndər
            </label>

            <input
                id="photoInput"
                type="file"
                accept="image/*"
                multiple
                hidden
            >

            <div id="status"></div>

            <div class="features">

                <div class="feature">
                    <span>🖼️</span>
                    Çoxlu şəkil
                </div>

                <div class="feature">
                    <span>⚡</span>
                    Sürətli
                </div>

                <div class="feature">
                    <span>🔒</span>
                    Təhlükəsiz
                </div>

            </div>

            <div class="bottom-info">
                📱 Telefonda şəkillərinizi seçin
            </div>

        </div>

    </main>


    <script>

        const input =
            document.getElementById("photoInput");

        const status =
            document.getElementById("status");


        input.addEventListener("change", async () => {

            const files =
                Array.from(input.files);


            if (files.length === 0) {
                return;
            }


            status.textContent =
                `⏳ ${files.length} şəkil göndərilir...`;


            const formData =
                new FormData();


            files.forEach(file => {

                formData.append(
                    "photos",
                    file
                );

            });


            try {

                const response =
                    await fetch(
                        "https://printersite.onrender.com/api/upload",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                if (
                    response.ok &&
                    result.success
                ) {

                    status.textContent =
                        `✅ ${result.count} şəkil uğurla göndərildi!`;

                    input.value = "";

                } else {

                    status.textContent =
                        "❌ Şəkillər göndərilmədi.";

                }

            } catch (error) {

                console.error(error);

                status.textContent =
                    "❌ Serverə qoşulmaq mümkün olmadı.";

            }

        });

    </script>

</body>

</html>
